[defaults]
stdout_callback = default
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = False
# Keygen mode: the deployment owns its key and nothing guarantees an agent
# holds it, so name it explicitly rather than relying on default identities.
private_key_file = /home/build-placeholder/.ssh/automq-fixture

[ssh_connection]
pipelining = True
# -F /dev/null: the run must not depend on ~/.ssh/config, a file shared with
# every other host the operator reaches and rewritten by the local stage while
# this run may be in flight.
ssh_args = -F /dev/null -o ControlMaster=auto -o ControlPersist=60s
