# One service per node. Host networking is not a shortcut: the CONTROLLER and
# INTERNAL listeners bind the VPC address specifically, and a bridged container
# cannot bind an address that belongs only to the host.
services:
  automq:
    image: automqinc/automq:1.7.4@sha256:68bf5df674ab9755da51f5200c152df391b0968aeeaf9ec4d12619517cd1234f
    container_name: automq
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 2m
    user: "0:0"
    environment:
      KAFKA_HEAP_OPTS: "-Xms2g -Xmx2g -XX:MetaspaceSize=96m -XX:MaxDirectMemorySize=3g"
      # The one credential that reaches the host, and the only one AutoMQ
      # itself needs. Read from the host environment file written 0600 by the
      # play; never baked into this file.
      KAFKA_S3_ACCESS_KEY: ${AUTOMQ_R2_ACCESS_KEY_ID}
      KAFKA_S3_SECRET_KEY: ${AUTOMQ_R2_SECRET_ACCESS_KEY}
    volumes:
      - /etc/automq/server.properties:/opt/automq/kafka/config/kraft/server.properties:ro
      - /etc/automq/tls:/etc/automq/tls:ro
      - /var/lib/automq:/var/lib/automq
    command:
      - /opt/automq/kafka/bin/kafka-server-start.sh
      - /opt/automq/kafka/config/kraft/server.properties
    healthcheck:
      # Asks the broker a question rather than trusting the process table: a
      # JVM that is up but cannot serve metadata is not a healthy broker.
      test: ["CMD-SHELL", "/opt/automq/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server {{ automq_vpc_ip }}:9094 --command-config /etc/automq/admin.properties >/dev/null 2>&1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 180s
