# AutoMQ automqinc/automq:1.7.4@sha256:68bf5df674ab9755da51f5200c152df391b0968aeeaf9ec4d12619517cd1234f
#
# Rendered by Ansible from the package template. Three kinds of value meet here
# and it is worth knowing which is which:
#
#      desired state, identical on every node, rendered before the run
#   {{ … }}   per-node facts from the inventory — node id, listeners, names
#   @…@       secrets, substituted on the host from /etc/automq/secrets by
#             render-config.sh, so that no password is ever written to
#             .colors/, to a golden file, or to an Ansible variable
#
# Never edit the copy on the host: it is regenerated on every converge.

# --- identity -----------------------------------------------------------------

process.roles=broker,controller
node.id={{ automq_node_id }}
cluster.id=VrUQI4OSR0y5vnTrGiKsxQ

# Static membership. Three fixed nodes are desired state, and a static voter
# list is what makes this file deterministic across converges and meaningful in
# the committed goldens. Every address here is a VPC address: the quorum never
# crosses the public interface.
controller.quorum.voters=0@10.40.0.10:9093,1@10.40.0.11:9093,2@10.40.0.12:9093

# --- listeners ----------------------------------------------------------------

# CONTROLLER and INTERNAL bind the VPC address specifically, which is why the
# container runs with host networking — a bridged container cannot bind an
# address that belongs only to the host. EXTERNAL binds every interface because
# it is the public endpoint.
listeners={{ automq_listeners }}
# CONTROLLER is deliberately absent below: Kafka rejects a controller entry in
# advertised.listeners.
advertised.listeners={{ automq_advertised_listeners }}
listener.security.protocol.map=CONTROLLER:SASL_PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_SSL
# Mandatory in KRaft, and not implied by the protocol map above: without it the
# broker will not start.
controller.listener.names=CONTROLLER
inter.broker.listener.name=INTERNAL

# --- authentication -----------------------------------------------------------

# Three listeners, two mechanisms, and the difference is a bootstrap argument
# rather than a preference.
#
# INTERNAL and EXTERNAL use SCRAM, whose credentials live in the replicated
# metadata log — which is fine for them, because both are used only after the
# controller quorum has formed and can serve that log.
#
# CONTROLLER uses PLAIN from a static JAAS entry below. Controller-to-controller
# SCRAM is what the quorum would have to authenticate with *before* the log it
# would read the credentials from exists (KAFKA-15513 reports exactly this
# failure). PLAIN has no such dependency, which makes it correct whether or not
# controller SCRAM works on a given build. The transport never leaves the VPC.
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
sasl.mechanism.controller.protocol=PLAIN
listener.name.controller.sasl.enabled.mechanisms=PLAIN
listener.name.internal.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.external.sasl.enabled.mechanisms=SCRAM-SHA-512

# PLAIN carries both directions in one entry, because it has no credential
# store behind it: `username`/`password` is who this node connects *as*, and
# `user_<name>` is who it accepts.
listener.name.controller.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="automq-controller" password="@CONTROLLER_PASSWORD@" user_automq-controller="@CONTROLLER_PASSWORD@";
listener.name.internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="automq-broker" password="@BROKER_PASSWORD@";

# --- transport security -------------------------------------------------------

# EXTERNAL only. The keystore is rebuilt from the published bundle whenever the
# certificate changes; see cert-deploy.sh.
listener.name.external.ssl.keystore.type=PKCS12
listener.name.external.ssl.keystore.location=/etc/automq/tls/keystore.p12
listener.name.external.ssl.keystore.password=@KEYSTORE_PASSWORD@
listener.name.external.ssl.key.password=@KEYSTORE_PASSWORD@
listener.name.external.ssl.client.auth=none
ssl.endpoint.identification.algorithm=https

# --- authorization ------------------------------------------------------------

# Authentication is not authorization, and 9092 faces the internet. Nothing is
# permitted by default; the client principal holds prefixed ACLs written by
# acl.sh and is deliberately not a superuser.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:automq-admin;User:automq-broker;User:automq-controller

# --- storage ------------------------------------------------------------------

# Local disk holds the KRaft metadata log only. Topic data lives in object
# storage: that is the entire point of AutoMQ, and it is why the replication
# factors below are 1 and why losing a node loses no bytes.
log.dirs=/var/lib/automq/metadata
elasticstream.enable=true

# Durability comes from R2, not from replicas. Upstream ships these as 1 for
# the same reason. A reader who expects RF=3 here should read the README before
# changing them: replicas would add cost and write amplification without adding
# durability, and the three nodes exist for quorum, failover and throughput.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1
min.insync.replicas=1

num.partitions=6
log.retention.hours=168

# The data bucket (id 0) and the ops bucket (id 1). AutoMQ supports no path
# prefix, so each role owns its bucket outright.
s3.data.buckets=0@s3://automq-fixture-data?region=auto&endpoint=https://fixture.r2.cloudflarestorage.com&pathStyle=true
s3.ops.buckets=1@s3://automq-fixture-ops?region=auto&endpoint=https://fixture.r2.cloudflarestorage.com&pathStyle=true
# The WAL lives in the data bucket. batchInterval is the lever that pays for R2
# being one provider away from the compute: every acknowledgement waits on an
# S3 write, so this is latency traded for throughput.
s3.wal.path=0@s3://automq-fixture-data?region=auto&endpoint=https://fixture.r2.cloudflarestorage.com&pathStyle=true&batchInterval=250&maxBytesInBatch=8388608

metric.reporters=kafka.autobalancer.metricsreporter.AutoBalancerMetricsReporter
